version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/staticfiles
    environment:
      - DEBUG=1
    env_file:
      - .env
    command: python3 manage.py runserver 0.0.0.0:8000
    depends_on:
      - db

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=food_order_db
      - POSTGRES_USER=food_app
      - POSTGRES_PASSWORD=dufladonjo
    ports:
      - "5433:5432"

volumes:
  postgres_data: