{% load static %}
<div class="menu-card-wrapper" style="height: 100%;">
    <div class="card h-100" style="background: #fff; border-radius: var(--radius-lg); border: 1.5px solid rgba(15,13,10,.08); overflow: hidden; transition: transform var(--transition-spring);">
        <div class="card-img-wrapper" style="height: 180px; background: linear-gradient(135deg, #f5f0e8, #ede8de); display: flex; align-items: center; justify-content: center; font-size: 3rem;">
            {% if item.image %}
                <img src="{{ item.image.url }}" alt="{{ item.name }}" style="width: 100%; height: 100%; object-fit: cover;">
            {% else %}
                🍔
            {% endif %}
        </div>
        <div class="card-body p-3 d-flex flex-column">
            <div class="mono-label" style="color: var(--color-ash); font-size: 10px; text-transform: uppercase; margin-bottom: 4px;">{{ item.category_id.name }}</div>
            <h5 class="card-title mb-2" style="font-family: var(--font-section); font-size: 1.35rem; color: var(--color-ink);">{{ item.name }}</h5>
            <p class="card-text text-ash mb-3" style="font-size: 0.82rem; font-weight: 300;">{{ item.description|truncatewords:15 }}</p>
            
            <div class="mt-auto d-flex align-items-center justify-content-between">
                <div class="mono-label fw-bold" style="font-size: 13px; color: var(--color-ink);">KES {{ item.price }}</div>
                
                {% if user.is_authenticated %}
                    <form method="POST" action="{% url 'orders:cart_add' %}" 
                          hx-post="{% url 'orders:cart_add' %}" 
                          hx-swap="none"
                          hx-on::after-request="this.reset()">
                        {% csrf_token %}
                        <input type="hidden" name="menu_item" value="{{ item.id }}">
                        <input type="hidden" name="quantity" value="1">
                        <button type="submit" class="btn-jtown-primary py-1 px-3" style="font-size: 11px;">+ Add</button>
                    </form>
                {% else %}
                    <button type="button" class="btn-jtown-primary py-1 px-3" style="font-size: 11px;" 
                            data-bs-toggle="modal" data-bs-target="#loginModal" data-item-id="{{ item.id }}">
                        + Add
                    </button>
                {% endif %}
            </div>
        </div>
    </div>
</div>

<style>
    .menu-card-wrapper:hover .card {
        transform: translateY(-4px);
    }
</style>
